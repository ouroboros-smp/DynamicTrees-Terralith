plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.dtteam.dynamictrees:dynamictrees-fabric-${minecraft_version}:${dynamicTreesVersion}"
    runtimeOnly "maven.modrinth:terralith:${terralithArtifactVersion}"
    runtimeOnly "maven.modrinth:lithostitched:${lithostitchedArtifactVersion}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    inputs.properties([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_description: mod_description,
            mod_authors: mod_authors,
            mod_license: mod_license,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            dynamicTreesVersion: dynamicTreesVersion,
            terralithVersion: terralithVersion,
            java_version: 25
    ])
    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}

loom {
    runs {
        server {
            server()
            setConfigName('Fabric Server')
            runDir('runs/server')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
